name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/validate-skill.mjs
      - name: Build the zip
        run: node tools/build-release.mjs --out dist --version "${GITHUB_REF_NAME#v}"
      - name: Publish the release, or attach the files if it already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
              --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md
          fi
