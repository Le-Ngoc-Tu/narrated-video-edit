name: Đề xuất / Feature or improvement
description: Hiệu ứng mới, ngôn ngữ, nguồn tài nguyên, sửa lỗi nền tảng, hoặc ý tưởng khác / A new effect, language, asset source, platform fix, or other idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Bạn muốn làm được điều gì? / What do you want to be able to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Có thể làm thế nào? / How could it work?
      description: Với nguồn tài nguyên, nêu địa chỉ API và giấy phép. Với hiệu ứng, mô tả diện mạo và lúc dùng. / For an asset source, give the API URL and its license. For an effect, describe the look and when to use it.
  - type: checkboxes
    id: help
    attributes:
      label: Bạn có thể giúp không? / Can you help?
      options:
        - label: Tôi có thể gửi pull request / I can send a pull request
        - label: Tôi có thể thử trên macOS hoặc Linux / I can test on macOS or Linux
