<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Lớp phủ</title>
<style>
  @font-face { font-family: 'Montserrat'; src: url('fonts/Montserrat-Variable.ttf'); font-weight: 100 900; font-style: normal; }
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/BeVietnamPro-Medium.ttf'); font-weight: 500; }
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/BeVietnamPro-SemiBold.ttf'); font-weight: 600; }
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/BeVietnamPro-ExtraBold.ttf'); font-weight: 800; }
  @font-face { font-family: 'Be Vietnam Pro'; src: url('fonts/BeVietnamPro-Black.ttf'); font-weight: 900; }
  @font-face { font-family: 'Anton'; src: url('fonts/Anton-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Bangers'; src: url('fonts/Bangers-Regular.ttf'); font-weight: 400; }
  @font-face { font-family: 'Lora'; src: url('fonts/Lora-Italic.ttf'); font-weight: 400 700; font-style: italic; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: transparent; }
  #stage * { box-sizing: border-box; }
  .cap { position: absolute; left: 0; right: 0; display: flex; justify-content: center; visibility: hidden; }
  .cap-in { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; text-align: center; max-width: 88%; }
  .cap .w { position: relative; display: inline-block; isolation: isolate; white-space: pre; }
  .cap .w .hl { position: absolute; z-index: -1; left: -0.14em; right: -0.14em; top: 0.02em; bottom: 0.02em; opacity: 0; border-radius: 0.28em; }
  .cap .w .mk { position: absolute; z-index: -1; left: -0.08em; right: -0.08em; bottom: 0.04em; height: 0.52em; transform-origin: 0 50%; opacity: 0; border-radius: 0.1em; }
  .sc { position: absolute; visibility: hidden; transform-origin: 50% 50%; }
  .sc-in { position: relative; width: 100%; height: 100%; overflow: hidden; background: #1c1c22; }
  .sc-in img { display: block; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .chip { position: absolute; white-space: nowrap; }
  .deco { position: absolute; visibility: hidden; transform-origin: 50% 50%; }
  .deco svg { display: block; overflow: visible; }
  .stat { position: absolute; visibility: hidden; }
  .lt { position: absolute; left: 0; visibility: hidden; }
  /* Hai lớp chụp riêng: front (mặc định) giấu phần tử behind; behind chỉ giữ phần tử behind (chữ đặt SAU người nói, ghép dưới mặt nạ người lúc finalize) */
  #stage[data-layer="front"] > [data-layer="behind"] { display: none !important; }
  #stage[data-layer="behind"] > :not([data-layer="behind"]) { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/DrawSVGPlugin.min.js"></script>
<script src="vendor/lottie.min.js"></script>
<script src="overlay-data.js"></script>
<script src="overlay.js"></script>
</body>
</html>
